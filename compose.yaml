services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_planner}
      POSTGRES_USER: ${POSTGRES_USER:-course_planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-course_planner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-course_planner} -d ${POSTGRES_DB:-course_planner}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
